# OpenDR LDAP Server - Development Configuration
#
# This configuration is optimized for local development and testing.
# NOT suitable for production use.

[server]
bind_address = "127.0.0.1"
ldap_port = 1389
ldaps_port = 1636
hostname = "localhost"
base_dn = "dc=example,dc=com"
root_user_dn = "cn=admin"
root_password = "admin"  # Simple password for development
organization_name = "Development Org"
read_buffer_size = 4096
operation_timeout_secs = 60
cleanup_interval_secs = 30
max_concurrent_operations = 50

[backend]
backend_type = "lmdb"
data_directory = "./data"
lmdb_max_size = 1073741824  # 1 GB
lmdb_max_readers = 50
import_sample_data = true  # Load sample data for testing
indexed_attributes = ["cn", "uid", "mail", "objectClass"]

[tls]
enabled = false  # Disabled for easier local testing

[resources]
max_connections = 100
max_connections_per_ip = 50  # Relaxed for development
max_operations_per_connection = 100
max_memory_per_connection = 10485760  # 10 MB
max_total_memory = 536870912  # 512 MB
connection_idle_timeout_secs = 300  # 5 minutes

[rate_limit]
enabled = false  # Disabled for easier testing

[replication]
enabled = false

[monitoring]
enabled = true
metrics_address = "127.0.0.1"
metrics_port = 9090
metrics_path = "/metrics"
health_path = "/health"

[audit]
enabled = true
log_file = "./logs/audit.log"
format = "text"  # More readable for development
level = "debug"  # Verbose logging
log_authentication = true
log_authorization = true
log_modifications = true
log_connections = true

[access_control]
enabled = false  # Disabled for easier testing
default_policy = "allow"

[performance]
worker_threads = 2  # Limited for development
schema_validation = true
indexing_enabled = true
cache_size = 100
query_optimization = false  # Disable for debugging
