# OpenDR LDAP Server - Production Configuration
#
# This configuration file is optimized for production deployments.
# Review and customize all settings before deploying.

[server]
bind_address = "0.0.0.0"
ldap_port = 389
ldaps_port = 636
hostname = "ldap.example.com"
base_dn = "dc=example,dc=com"
root_user_dn = "cn=admin,dc=example,dc=com"
root_password = "CHANGE_THIS_PASSWORD_IMMEDIATELY"
organization_name = "Example Corporation"
read_buffer_size = 8192
operation_timeout_secs = 600
cleanup_interval_secs = 120
max_concurrent_operations = 200

[backend]
backend_type = "lmdb"
data_directory = "/var/lib/opendr/data"
lmdb_max_size = 21474836480  # 20 GB
lmdb_max_readers = 200
import_sample_data = false
indexed_attributes = ["cn", "uid", "mail", "sn", "givenName", "objectClass", "ou"]

[tls]
enabled = true
cert_file = "/etc/opendr/certs/server.crt"
key_file = "/etc/opendr/certs/server.key"
ca_file = "/etc/opendr/certs/ca.crt"
require_client_cert = false
min_tls_version = "1.3"

[resources]
max_connections = 2000
max_connections_per_ip = 50
max_operations_per_connection = 200
max_memory_per_connection = 20971520  # 20 MB
max_total_memory = 2147483648  # 2 GB
connection_idle_timeout_secs = 1200  # 20 minutes

[rate_limit]
enabled = true
global_requests_per_second = 5000
per_client_requests_per_second = 500
burst_size = 200
window_duration_secs = 1
adaptive_enabled = true
adaptive_threshold = 0.75
adaptive_multiplier = 0.6
auto_ban_threshold = 500
auto_ban_duration_secs = 1800  # 30 minutes
blacklist = []
whitelist = ["127.0.0.1", "::1"]

[rate_limit.operation_limits]
bind = 50
search = 200
modify = 100
add = 100
delete = 50
modifydn = 50
compare = 150
extended = 100

[replication]
enabled = false
mode = "provider"
changelog_capacity = 50000
sync_interval_secs = 30

[monitoring]
enabled = true
metrics_address = "0.0.0.0"
metrics_port = 9090
metrics_path = "/metrics"
health_path = "/health"

[audit]
enabled = true
log_file = "/var/log/opendr/audit.log"
format = "json"
level = "info"
log_authentication = true
log_authorization = true
log_modifications = true
log_connections = false

[access_control]
enabled = true
default_policy = "deny"
rules_file = "/etc/opendr/config/aci_rules.toml"

[performance]
worker_threads = 0  # Auto-detect
schema_validation = true
indexing_enabled = true
cache_size = 10000
query_optimization = true
