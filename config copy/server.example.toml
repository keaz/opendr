# OpenDR LDAP Server Configuration File
#
# This is an example configuration file showing all available options
# with their default values and descriptions.
#
# Copy this file to server.toml and customize as needed.

#=============================================================================
# Server Settings
#=============================================================================
[server]
# Bind address for the LDAP server
bind_address = "127.0.0.1"

# LDAP port (non-TLS)
ldap_port = 1389

# LDAPS port (TLS/SSL)
ldaps_port = 1636

# Server hostname
hostname = "localhost"

# Base DN for the directory
base_dn = "dc=example,dc=com"

# Root user DN (admin account)
root_user_dn = "cn=admin"

# Root password (will be hashed on first use)
root_password = "secret"

# Organization name
organization_name = "Example Organization"

# Read buffer size in bytes
read_buffer_size = 4096

# Operation timeout in seconds
operation_timeout_secs = 300

# Cleanup interval in seconds (for expired operations)
cleanup_interval_secs = 60

# Maximum concurrent operations per connection
max_concurrent_operations = 100

#=============================================================================
# Backend Settings
#=============================================================================
[backend]
# Backend type: "memory" or "lmdb"
backend_type = "lmdb"

# Data directory for persistent backends
data_directory = "./data"

# LMDB maximum database size in bytes (10 GB default)
lmdb_max_size = 10737418240

# LMDB maximum concurrent readers
lmdb_max_readers = 126

# Import sample data on first startup
import_sample_data = false

# Indexed attributes for faster searches
indexed_attributes = ["cn", "uid", "mail", "objectClass"]

#=============================================================================
# TLS/SSL Settings
#=============================================================================
[tls]
# Enable TLS/SSL
enabled = false

# Certificate file path
cert_file = "certs/server.crt"

# Private key file path
key_file = "certs/server.key"

# CA certificate file (optional, for client cert verification)
# ca_file = "certs/ca.crt"

# Require client certificates
require_client_cert = false

# Minimum TLS version: "1.2" or "1.3"
min_tls_version = "1.2"

#=============================================================================
# Resource Management Settings
#=============================================================================
[resources]
# Maximum total concurrent connections
max_connections = 1000

# Maximum connections per IP address
max_connections_per_ip = 10

# Maximum operations per connection
max_operations_per_connection = 100

# Maximum memory per connection in bytes (10 MB)
max_memory_per_connection = 10485760

# Maximum total server memory in bytes (1 GB)
max_total_memory = 1073741824

# Connection idle timeout in seconds (10 minutes)
connection_idle_timeout_secs = 600

#=============================================================================
# Rate Limiting Settings
#=============================================================================
[rate_limit]
# Enable rate limiting
enabled = true

# Global requests per second (across all clients)
global_requests_per_second = 1000

# Per-client requests per second
per_client_requests_per_second = 100

# Burst size (number of requests allowed in burst)
burst_size = 50

# Window duration in seconds
window_duration_secs = 1

# Enable adaptive rate limiting (reduces limits under high load)
adaptive_enabled = true

# Adaptive threshold (0.0-1.0, % of global limit to trigger adaptation)
adaptive_threshold = 0.8

# Adaptive multiplier (0.0-1.0, factor to reduce limits by)
adaptive_multiplier = 0.5

# Auto-ban threshold (violations before auto-ban)
auto_ban_threshold = 100

# Auto-ban duration in seconds (5 minutes)
auto_ban_duration_secs = 300

# Blacklisted IP addresses (always blocked)
blacklist = []

# Whitelisted IP addresses (bypass rate limits)
whitelist = []

# Operation-specific rate limits (requests per second)
[rate_limit.operation_limits]
bind = 10      # Authentication attempts
search = 50    # Search operations
modify = 20    # Modify operations
add = 20       # Add operations
delete = 10    # Delete operations
modifydn = 10  # Rename operations
compare = 30   # Compare operations
extended = 20  # Extended operations

#=============================================================================
# Replication Settings
#=============================================================================
[replication]
# Enable replication
enabled = false

# Replication mode: "provider", "consumer", or "both"
mode = "provider"

# Provider URL (required for consumer mode)
# provider_url = "ldap://provider.example.com:389"

# Replication bind DN (for authentication to provider)
# bind_dn = "cn=replicator,dc=example,dc=com"

# Replication bind password
# bind_password = "secret"

# Changelog capacity (number of changes to keep)
changelog_capacity = 10000

# Sync interval in seconds (for consumer mode)
sync_interval_secs = 60

#=============================================================================
# Monitoring and Metrics Settings
#=============================================================================
[monitoring]
# Enable metrics collection
enabled = true

# Metrics export address
metrics_address = "127.0.0.1"

# Metrics export port
metrics_port = 9090

# Prometheus metrics path
metrics_path = "/metrics"

# Health check path
health_path = "/health"

#=============================================================================
# Audit Logging Settings
#=============================================================================
[audit]
# Enable audit logging
enabled = true

# Audit log file path
log_file = "./logs/audit.log"

# Log format: "json", "syslog", or "text"
format = "json"

# Minimum log level: "debug", "info", "warning", "error", or "critical"
level = "info"

# Log authentication events
log_authentication = true

# Log authorization events
log_authorization = true

# Log data modifications
log_modifications = true

# Log connection events
log_connections = true

#=============================================================================
# Access Control Settings
#=============================================================================
[access_control]
# Enable access control
enabled = true

# Default access policy: "allow" or "deny"
default_policy = "deny"

# ACI rules file path (optional)
# rules_file = "./config/aci_rules.toml"

#=============================================================================
# Performance Tuning Settings
#=============================================================================
[performance]
# Worker threads (0 = auto-detect based on CPU cores)
worker_threads = 0

# Enable schema validation
schema_validation = true

# Enable indexing
indexing_enabled = true

# Entry cache size (number of entries)
cache_size = 1000

# Enable query optimization
query_optimization = true
