name: Rust

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --check
      - name: FSM runtime parity gate
        run: cargo test --test runtime_selection_integration --test fsm_server_integration --test ldap_ops_client_integration --test tls_runtime_integration --test legacy_runtime_limits_binary_integration --no-fail-fast
      - name: Run tests
        run: cargo test --workspace --no-fail-fast
      - name: Run doctests
        run: cargo test --doc --quiet
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
