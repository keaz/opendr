name: Production Readiness Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-readiness.yml"
      - "docs/LDAP_RFC_COMPLIANCE_MATRIX.md"
      - "docs/BACKUP_RESTORE.md"
      - "docs/DEVELOPER_GUIDE.md"
      - "docs/FUZZING.md"
      - "docs/PRODUCTION_READINESS_CHECKLIST.md"
      - "docs/REPLICATION_PRODUCTION_GUARANTEES.md"
      - "docs/TLS_ROTATION.md"
      - "e2e_tests/**"
      - "fuzz/**"
      - "scripts/fuzz_gate.sh"
      - "scripts/backup_restore_drill.sh"
      - "scripts/ldap_interop_gate.sh"
      - "scripts/perf_regression_gate.sh"
      - "scripts/tls_rotation_gate.sh"

env:
  CARGO_TERM_COLOR: always

jobs:
  readiness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install external LDAP clients
        run: |
          sudo apt-get update
          sudo apt-get install -y ldap-utils openssl python3-pip python3-venv zsh netcat-openbsd
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ldap3
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate shell scripts
        run: |
          bash -n scripts/ldap_interop_gate.sh
          bash -n scripts/referral_alias_interop.sh
          bash -n scripts/perf_regression_gate.sh
          bash -n scripts/backup_restore_drill.sh
          bash -n scripts/fuzz_gate.sh
          bash -n scripts/tls_rotation_gate.sh
          zsh -n e2e_tests/helpers.sh
          zsh -n e2e_tests/test_single_provider_single_consumer.sh
          zsh -n e2e_tests/test_replication_soak.sh
          zsh -n e2e_tests/test_replication_failure_drills.sh

      - name: Core quality gate
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --no-fail-fast
          cargo test --doc --quiet

      - name: External interoperability gate
        run: ./scripts/ldap_interop_gate.sh

      - name: TLS rotation smoke gate
        run: |
          TLS_ROTATION_ARTIFACT_DIR=target/tls-rotation-gate/readiness-smoke \
          ./scripts/tls_rotation_gate.sh

      - name: Replication soak smoke gate
        run: |
          cargo build --bin opendr
          SERVER_BIN="$PWD/target/debug/opendr" \
          PROVIDER_PORT=43910 \
          CONSUMER_PORT=43911 \
          SOAK_DURATION_SECS=10 \
          SOAK_BATCH_SIZE=2 \
          SOAK_MODIFY_PER_ROUND=1 \
          SOAK_DELETE_EVERY_ROUNDS=1 \
          SOAK_MIN_ACTIVE_BEFORE_DELETE=1 \
          REPL_TIMEOUT_SECS=45 \
          ./e2e_tests/test_replication_soak.sh

      - name: Replication failure drill smoke gate
        run: |
          SERVER_BIN="$PWD/target/debug/opendr" \
          PROVIDER_PORT=43912 \
          CONSUMER_PORT=43913 \
          FAILURE_DRILL_MODE=smoke \
          FAILURE_DRILL_ARTIFACT_DIR=target/replication-failure-drills/readiness-smoke \
          REPL_TIMEOUT_SECS=45 \
          ./e2e_tests/test_replication_failure_drills.sh

      - name: Performance regression smoke gate
        run: |
          PERF_GATE_MODE=smoke \
          PERF_GATE_OUTPUT_DIR=target/perf/readiness-smoke \
          PERF_GATE_PORT=43920 \
          PERF_GATE_SMOKE_PROFILE=debug \
          PERF_GATE_SMOKE_USERS=20 \
          PERF_GATE_SMOKE_READ_ITERATIONS=5 \
          PERF_GATE_SMOKE_WRITE_ITERATIONS=3 \
          PERF_GATE_SMOKE_WARMUP_ITERATIONS=1 \
          PERF_GATE_MAX_FAILURE_RATE_PERCENT=0 \
          PERF_GATE_MAX_P95_MS=5000 \
          ./scripts/perf_regression_gate.sh

      - name: Backup restore smoke drill
        run: |
          BACKUP_DRILL_MODE=smoke \
          BACKUP_DRILL_OUTPUT_DIR=target/backup-restore-drill/readiness-smoke \
          BACKUP_DRILL_PROFILE=debug \
          BACKUP_DRILL_USERS=50 \
          BACKUP_DRILL_BATCH_SIZE=50 \
          BACKUP_DRILL_PORT=43930 \
          ./scripts/backup_restore_drill.sh

      - name: Fuzz target compile gate
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

      - name: Fuzz smoke gate
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal
          if ! cargo fuzz --help >/dev/null 2>&1; then
            cargo install cargo-fuzz --locked
          fi
          FUZZ_GATE_MODE=smoke \
          FUZZ_GATE_SMOKE_RUNS=16 \
          FUZZ_GATE_OUTPUT_DIR=target/fuzz-gate/readiness-smoke \
          ./scripts/fuzz_gate.sh

      - name: Release-only long gates
        run: |
          cat <<'EOF'
          Run these before a production-ready release and retain artifacts:
          rustup toolchain install nightly-2026-03-01 --profile minimal
          cargo install cargo-fuzz --locked
          FUZZ_GATE_MODE=release FUZZ_GATE_OUTPUT_DIR=target/fuzz-gate/release-candidate ./scripts/fuzz_gate.sh
          SOAK_DURATION_SECS=86400 SOAK_ARTIFACT_DIR=target/replication-soak/release-candidate ./e2e_tests/test_replication_soak.sh
          FAILURE_DRILL_MODE=release FAILURE_DRILL_ARTIFACT_DIR=target/replication-failure-drills/release-candidate ./e2e_tests/test_replication_failure_drills.sh
          TLS_ROTATION_ARTIFACT_DIR=target/tls-rotation-gate/release-candidate ./scripts/tls_rotation_gate.sh
          PERF_GATE_MODE=release PERF_GATE_BASELINE_JSON=target/perf/regression-baseline/opendr/regression-100k/ldap-benchmark-results.json PERF_GATE_OUTPUT_DIR=target/perf/regression-candidate ./scripts/perf_regression_gate.sh
          BACKUP_DRILL_MODE=release BACKUP_DRILL_USERS=100000 BACKUP_DRILL_OUTPUT_DIR=target/backup-restore-drill/release-candidate ./scripts/backup_restore_drill.sh
          ./scripts/referral_alias_interop.sh
          ./scripts/perf_docker_matrix.sh --products opendr --profile-set regression --output-dir target/perf/regression-candidate
          EOF
