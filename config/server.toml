[server]
bind_address = "localhost"
ldap_port = 1388
runtime = "fsm"
# Must be unique per replicated node when replication is enabled
replica_id = 1
base_dn = "dc=example,dc=com"
root_user_dn = "cn=manager"
# For LMDB, the referenced secret should contain the full {SSHA512} hash value.
root_password_file = "/run/secrets/opendr-root-password-hash"

[backend]
backend_type = "lmdb"
data_directory = "./data"
lmdb_max_size = 10737418240  # 10GB
lmdb_max_readers = 256
# Legacy indexed_attributes entries get equality and presence indexes.
# indexed_attributes = ["cn", "uid", "mail", "objectClass", "ou"]
#
# Typed indexes can add OpenDJ-style index categories for custom attributes.
# [[backend.indexes]]
# attribute = "cn"
# types = ["substring"]
#
# [[backend.indexes]]
# attribute = "entryCSN"
# types = ["ordering"]

[resources]
# Support at least 128 concurrent clients from the same Docker bridge / proxy IP
# with operational headroom for health checks, admin sessions, and replication.
max_connections = 512
max_connections_per_ip = 256
max_operations_per_connection = 200
max_memory_per_connection = 10485760  # 10 MiB
max_total_memory = 2147483648         # 2 GiB
connection_idle_timeout_secs = 600

[rate_limit]
# Keep rate limiting enabled while allowing the measured 128-client same-IP
# login burst profile. The Docker perf run peaked around 31k bind ops/s.
enabled = true
global_requests_per_second = 100000
per_client_requests_per_second = 50000
burst_size = 5000
window_duration_secs = 1
adaptive_enabled = true
adaptive_threshold = 0.90
adaptive_multiplier = 0.75
auto_ban_threshold = 1000
auto_ban_duration_secs = 300
blacklist = []
whitelist = []

[rate_limit.operation_limits]
bind = 50000
search = 50000
modify = 5000
add = 5000
delete = 5000
modifydn = 5000
compare = 50000
extended = 5000

[replication]
enabled = true
mode = "consumer"
provider_url = "ldap://localhost:1389"
bind_dn = "cn=manager,dc=example,dc=com"
bind_password_file = "/run/secrets/opendr-replication-bind-password"
max_retry_attempts = 3
retry_delay_secs = 5
enable_change_listening = true
state_storage_path = "./data/replication_state"
