# OpenDR listener-based replication consumer example.
#
# Poll-based consumer replication has been removed. Keep
# enable_change_listening = true for consumer and both modes.

[server]
bind_address = "0.0.0.0"
ldap_port = 2389
ldaps_port = 2636
replica_id = 2
base_dn = "dc=example,dc=com"
root_user_dn = "cn=manager"
root_password_file = "/run/secrets/opendr-consumer-root-password-hash"
organization_name = "Example Consumer"

[backend]
backend_type = "lmdb"
data_directory = "/var/lib/opendr/consumer/data"
lmdb_max_size = 10737418240
lmdb_max_readers = 126
indexed_attributes = ["cn", "uid", "mail", "objectClass", "ou", "sn", "givenName"]

[replication]
enabled = true
mode = "consumer"
provider_url = "ldap://provider.example.com:1389"
bind_dn = "cn=replication,dc=example,dc=com"
bind_password_file = "/run/secrets/opendr-replication-bind-password"
max_batch_size = 100
max_retry_attempts = 5
retry_delay_secs = 10
enable_change_listening = true
heartbeat_interval_secs = 60
provider_timeout_secs = 30
state_persistence_timeout_secs = 10
change_buffer_size = 1000
state_storage_path = "/var/lib/opendr/consumer/replication_state"

[tls]
enabled = true
cert_file = "/etc/opendr/certs/consumer.crt"
key_file = "/etc/opendr/certs/consumer.key"
ca_file = "/etc/opendr/certs/ca.crt"
min_tls_version = "1.2"

[resources]
max_connections = 500
max_connections_per_ip = 10
max_operations_per_connection = 100
max_memory_per_connection_mb = 5
max_total_memory_mb = 1024
idle_timeout_secs = 300

[rate_limit]
enabled = true
global_requests_per_second = 1000
per_client_requests_per_second = 100
adaptive_enabled = true

[monitoring]
enabled = true
metrics_port = 9091

[audit]
enabled = true
log_file = "/var/log/opendr/consumer-audit.log"
format = "json"
level = "info"
log_authentication = true
log_modifications = true
