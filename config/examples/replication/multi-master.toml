# OpenDR dual-role replication example.
#
# "both" mode starts a provider service and a listener-based consumer service
# in the same process. If more than one node accepts writes, deploy an external
# conflict-resolution strategy.

[server]
bind_address = "0.0.0.0"
ldap_port = 1389
ldaps_port = 1636
replica_id = 10
base_dn = "dc=example,dc=com"
root_user_dn = "cn=manager"
root_password_file = "/run/secrets/opendr-master-root-password-hash"
organization_name = "Example Master A"

[backend]
backend_type = "lmdb"
data_directory = "/var/lib/opendr/master-a/data"
lmdb_max_size = 10737418240
lmdb_max_readers = 126
indexed_attributes = ["cn", "uid", "mail", "objectClass", "ou", "sn", "givenName"]

[replication]
enabled = true
mode = "both"

# Provider side
changelog_capacity = 100000
changelog_enabled = true
max_batch_size = 100
enable_streaming = true
max_concurrent_consumers = 100
consumer_timeout_secs = 300

# Consumer side
# Install the peer provider CA in the local host trust store before using ldaps://.
provider_url = "ldaps://master-b.example.com:1636"
bind_dn = "cn=replication,dc=example,dc=com"
bind_password_file = "/run/secrets/opendr-replication-bind-password"
max_retry_attempts = 5
retry_delay_secs = 5
enable_change_listening = true
heartbeat_interval_secs = 60
provider_timeout_secs = 30
state_persistence_timeout_secs = 10
change_buffer_size = 1000
state_storage_path = "/var/lib/opendr/master-a/replication_state"

[tls]
enabled = true
cert_file = "/etc/opendr/certs/master-a.crt"
key_file = "/etc/opendr/certs/master-a.key"
ca_file = "/etc/opendr/certs/ca.crt"
require_client_cert = true
min_tls_version = "1.2"

[resources]
max_connections = 1000
max_connections_per_ip = 50
max_operations_per_connection = 200
max_memory_per_connection = 10485760
max_total_memory = 2147483648
connection_idle_timeout_secs = 600

[rate_limit]
enabled = true
global_requests_per_second = 10000
per_client_requests_per_second = 1000
adaptive_enabled = true

[monitoring]
enabled = true
metrics_port = 9090

[audit]
enabled = true
log_file = "/var/log/opendr/master-a-audit.log"
format = "json"
level = "info"
log_authentication = true
log_authorization = true
log_modifications = true
