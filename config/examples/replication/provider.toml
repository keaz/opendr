# OpenDR listener-based replication provider example.

[server]
bind_address = "0.0.0.0"
ldap_port = 1389
ldaps_port = 1636
replica_id = 1
base_dn = "dc=example,dc=com"
root_user_dn = "cn=manager"
root_password_file = "/run/secrets/opendr-provider-root-password-hash"
organization_name = "Example Provider"

[backend]
backend_type = "lmdb"
data_directory = "/var/lib/opendr/provider/data"
lmdb_max_size = 10737418240
lmdb_max_readers = 126
indexed_attributes = ["cn", "uid", "mail", "objectClass", "ou", "sn", "givenName"]

[replication]
enabled = true
mode = "provider"
changelog_capacity = 100000
changelog_enabled = true
max_batch_size = 100
enable_streaming = true
heartbeat_interval_secs = 60
max_concurrent_consumers = 100
consumer_timeout_secs = 300
state_storage_path = "/var/lib/opendr/provider/replication_state"

[tls]
enabled = true
cert_file = "/etc/opendr/certs/provider.crt"
key_file = "/etc/opendr/certs/provider.key"
ca_file = "/etc/opendr/certs/ca.crt"
min_tls_version = "1.2"

[resources]
max_connections = 1000
max_connections_per_ip = 50
max_operations_per_connection = 200
max_memory_per_connection = 10485760
max_total_memory = 2147483648
connection_idle_timeout_secs = 600

[rate_limit]
enabled = true
global_requests_per_second = 10000
per_client_requests_per_second = 1000
adaptive_enabled = true

[monitoring]
enabled = true
metrics_port = 9090

[audit]
enabled = true
log_file = "/var/log/opendr/provider-audit.log"
format = "json"
level = "info"
log_authentication = true
log_authorization = true
log_modifications = true
