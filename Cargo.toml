[package]
name = "opendr"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bincode = "1.3.3"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
config = "0.15.22"
hex = "0.4.3"
hostname = "0.4.2"
lazy_static = "1.5.0"
lber = "0.5.1"
ldap-parser = "0.5.0"
ldap3 = "0.12.1"
lmdb = "0.8.0"
lmdb-sys = "0.8.0"
log = "0.4.29"
log4rs = "1.4.0"
rand = "0.10.1"
rasn = "0.16.6"
rasn-ldap = "0.16.6"
rustls = "0.23.37"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
socket2 = "0.6.3"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
tokio-rustls = "0.26.4"
toml = "1.1.2"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4", "v5"] }

[dev-dependencies]
criterion = "0.8.2"
mockall = "0.14.0"
rcgen = "0.14.7"
tempfile = "3.27.0"

[[bench]]
name = "backend_benchmarks"
harness = false

[[bin]]
name = "opendr-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "opendr-backup"
path = "src/bin/opendr_backup.rs"

[[bin]]
name = "opendr-restore"
path = "src/bin/opendr_restore.rs"

[[bench]]
name = "fsm_benchmarks"
harness = false

[[bench]]
name = "schema_benchmarks"
harness = false

[[bench]]
name = "server_benchmarks"
harness = false
