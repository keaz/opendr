[package]
name = "opendr"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
clap = { version = "4.5.8", features = ["derive"] }
config = "0.14.0"
hex = "0.4.3"
lazy_static = "1.5.0"
ldap-parser = "0.4.0"
ldap3 = { version = "0.11.5" }
log = "0.4.22"
log4rs = "1.3.0"
nom = "7.1.3"
rasn = "0.16.0"
rasn-ldap = "0.16.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38.0", features = ["full"] }
uuid = { version = "1.9.1", features = ["v4"] }

[dev-dependencies]
mockall = "0.12.1"
