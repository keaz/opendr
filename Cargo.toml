[package]
name = "opendr"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
clap = { version = "4.5.8", features = ["derive"] }
config = "0.14.0"
hex = "0.4.3"
lazy_static = "1.5.0"
ldap-parser = "0.4.0"
ldap3 = { version = "0.11.5" }
lmdb = "0.8.0"
log = "0.4.22"
log4rs = "1.3.0"
nom = "7.1.3"
rasn = "0.16.0"
rasn-ldap = "0.16.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["full"] }
uuid = { version = "1.9.1", features = ["v4"] }
async-trait = "0.1.80"
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
url = "2.5"
socket2 = "0.5"
hostname = "0.4"

[dev-dependencies]
mockall = "0.12.1"
criterion = "0.5"
tempfile = "3.10"
rcgen = "0.13"

[[bench]]
name = "backend_benchmarks"
harness = false

[[bin]]
name = "opendr-setup"
path = "src/bin/setup.rs"

[[bench]]
name = "fsm_benchmarks"
harness = false

[[bench]]
name = "schema_benchmarks"
harness = false

[[bench]]
name = "server_benchmarks"
harness = false
